# Deploys the EFFECTS build as its own Workers static-assets project.
#
# This repository is a copy of Tony_Deng_Website kept for trying visual work
# out. It shares that repository's history and keeps it as the `upstream`
# remote, so finished work can be moved across with git rather than by hand:
#
#   git fetch upstream && git log upstream/main    # what has changed live
#   git cherry-pick <sha>                          # take one commit
#
# The Worker name below is what keeps the two apart. It is different from the
# live site's, so a deploy from this repository cannot reach the real one.
#
# The Cloudflare build runs `python3 build.py --dist` first, which renders
# index.html and zh/index.html from content/*.json and assembles dist/;
# the deploy command `npx wrangler deploy` then uploads what this points at.
# dist/ is gitignored on purpose, so it only ever exists as build output.
#
# The admin API runs inside this same Worker. `main` is the admin script,
# but `run_worker_first` hands it /api/admin/* only; every other request is
# answered from dist/ without the script running at all, so the public site
# costs nothing extra and cannot be broken by the admin.
#
# It lives here rather than in its own Worker because a separate Worker can
# only be attached to a path on a custom domain, and this site is still on
# workers.dev. Once there is a domain, it can move back behind Cloudflare
# Access — see the note at the top of workers/admin/src/index.js.
name = "tony-deng-website-effects"
main = "workers/admin/src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/admin/*"]

[vars]
# This copy of the admin must never write to the live repository - it is
# pointed at the effects one, so saving from the effects admin edits the
# experiment rather than the site that is actually published.
GITHUB_REPO = "DarkStar-31/Tony_Deng_Website_Effects"
LIVE_BRANCH = "main"
DRAFT_BRANCH = "draft"

# Two secrets, never in this file. Set them in the Cloudflare dashboard:
# this Worker -> Settings -> Variables and Secrets -> Add -> type Secret.
#   GITHUB_TOKEN    fine-grained PAT, only this repo, Contents: read & write
#   ADMIN_PASSWORD  the password for /admin; changing it signs everyone out
# Secrets survive deploys; plain variables added in the dashboard do not,
# which is why the ones above live here. Both repos are public, so the
# password must never be written into this file.
